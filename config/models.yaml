# Role → model mapping (docs/14-MODELS-AND-COSTS.md). Model IDs change often:
# check each provider's docs and update the IDs here; code never hard-codes them.
#
# Which model a call gets (first usable wins; "usable" = API key set, free cap not nearly used, paid budget left):
#   1. the agent's model_override (Agents page)
#   2. env MODEL_ID_<ROLE> (MODEL_ID_LEAD, MODEL_ID_DEV, MODEL_ID_DESIGN, MODEL_ID_WRITER, MODEL_ID_SALES,
#      MODEL_ID_QA, MODEL_ID_LIGHT, …), format provider:model, e.g. MODEL_ID_QA=openai:gpt-5.5
#   3. this file: profiles.<active profile>.<role>, in order (later entries are fallbacks)
# Roles missing from a profile fall back: design/writer/sales → specialist.
# Paid models (anthropic, openai, moonshot, and openrouter models WITHOUT ":free") only run when MONTHLY_BUDGET_USD > 0.
active_profile: free   # free | paid | hybrid | claude | openai | kimi  (env MODEL_PROFILE overrides)

profiles:
  free:
    # Checked 2026-09-29 against HQ's own keys: Gemini free = 20 requests/day PER MODEL; Groq free = 8k tokens/min (too
    # small for long agent prompts, fine for chat); OpenRouter free account = ~50 requests/day across all :free models.
    # moonshot:kimi-k2.6 (paid, MOONSHOT_API_KEY) is the LAST resort of every role (docs/15 §7): it only runs when all the
    # free models above are unavailable AND MONTHLY_BUDGET_USD > 0; the daily AI budget stops it like any paid model.
    lead:       [google:gemini-3.8-flash, google:gemini-3.5-flash-lite, groq:openai/gpt-oss-120b, openrouter:nvidia/nemotron-3-super-120b-a12b:free, openrouter:qwen/qwen3.8-27b:free, moonshot:kimi-k2.6]
    specialist: [google:gemini-3.8-flash, google:gemini-3.5-flash-lite, groq:openai/gpt-oss-120b, openrouter:nvidia/nemotron-3-super-120b-a12b:free, openrouter:qwen/qwen3.8-27b:free, moonshot:kimi-k2.6]
    dev:        [google:gemini-3.8-flash, google:gemini-3.5-flash-lite, groq:openai/gpt-oss-120b, openrouter:qwen/qwen3.8-27b:free, moonshot:kimi-k2.6]
    design:     [google:gemini-3.8-flash, google:gemini-3.5-flash-lite, groq:openai/gpt-oss-120b, openrouter:nvidia/nemotron-3-super-120b-a12b:free, moonshot:kimi-k2.6]
    writer:     [google:gemini-3.8-flash, google:gemini-3.5-flash-lite, groq:openai/gpt-oss-120b, openrouter:nvidia/nemotron-3-super-120b-a12b:free, openrouter:qwen/qwen3.8-27b:free, moonshot:kimi-k2.6]
    sales:      [google:gemini-3.8-flash, google:gemini-3.5-flash-lite, groq:openai/gpt-oss-120b, openrouter:nvidia/nemotron-3-super-120b-a12b:free, openrouter:qwen/qwen3.8-27b:free, moonshot:kimi-k2.6]
    reports:    [google:gemini-3.8-flash, google:gemini-3.5-flash-lite, groq:openai/gpt-oss-120b, openrouter:nvidia/nemotron-3-super-120b-a12b:free, moonshot:kimi-k2.6]
    qa:         [google:gemini-3.8-flash, google:gemini-3.5-flash-lite, groq:openai/gpt-oss-120b, openrouter:nvidia/nemotron-3-super-120b-a12b:free, moonshot:kimi-k2.6]
    light:      [groq:openai/gpt-oss-20b, google:gemini-3.5-flash-lite, groq:qwen/qwen3.8-27b, openrouter:google/gemma-4-31b-it:free, google:gemini-3.8-flash, moonshot:kimi-k2.6]
  # Paid API keys only (Anthropic Console + OpenAI platform; Claude.ai Pro/Max subscriptions can't power agents).
  # Needs ANTHROPIC_API_KEY, OPENAI_API_KEY and MONTHLY_BUDGET_USD > 0. Anthropic calls use prompt caching.
  # IDs below are the defaults; MODEL_ID_<ROLE> env vars override them. DAILY_AI_BUDGET_USD reached → paid providers stop
  # for the Manila day and every role falls back to the `free` profile's list (when a free key is set) or waits.
  paid:
    lead:       [anthropic:claude-sonnet-5]
    dev:        [anthropic:claude-sonnet-5]
    sales:      [anthropic:claude-sonnet-5]
    design:     [anthropic:claude-haiku-4-5-20251001]
    writer:     [anthropic:claude-haiku-4-5-20251001]   # switch to claude-sonnet-5 (MODEL_ID_WRITER) if QA flags quality
    qa:         [openai:gpt-5.5, anthropic:claude-sonnet-5]   # a different provider on purpose (fresh eyes); Sonnet only if OpenAI is unavailable
    light:      [anthropic:claude-haiku-4-5-20251001]
    reports:    [anthropic:claude-haiku-4-5-20251001]
    specialist: [anthropic:claude-sonnet-5]
  hybrid:
    lead:       [anthropic:claude-sonnet-5]
    specialist: [google:gemini-3.8-flash, groq:openai/gpt-oss-120b]
    dev:        [anthropic:claude-sonnet-5]
    design:     [google:gemini-3.8-flash, groq:openai/gpt-oss-120b]
    writer:     [google:gemini-3.8-flash, groq:openai/gpt-oss-120b]
    sales:      [google:gemini-3.8-flash, groq:openai/gpt-oss-120b]
    reports:    [anthropic:claude-sonnet-5]
    qa:         [anthropic:claude-sonnet-5]
    light:      [groq:openai/gpt-oss-20b]
  claude:
    lead:       [anthropic:claude-opus-5-5]
    specialist: [anthropic:claude-sonnet-5]
    dev:        [anthropic:claude-sonnet-5]
    design:     [anthropic:claude-sonnet-5]
    writer:     [anthropic:claude-sonnet-5]
    sales:      [anthropic:claude-sonnet-5]
    reports:    [anthropic:claude-sonnet-5]
    qa:         [anthropic:claude-opus-5-5]
    light:      [anthropic:claude-haiku-4-5-20251001]
  openai:        # fill in current model IDs from OpenAI's docs before using
    lead:       [openai:gpt-5.5]
    specialist: [openai:gpt-5.4-mini]
    dev:        [openai:gpt-5.4]
    design:     [openai:gpt-5.4-mini]
    writer:     [openai:gpt-5.4-mini]
    sales:      [openai:gpt-5.4]
    reports:    [openai:gpt-5.4-mini]
    qa:         [openai:gpt-5.5]
    light:      [openai:gpt-5.4-nano]
  # Kimi (Moonshot, platform.kimi.ai): needs MOONSHOT_API_KEY and MONTHLY_BUDGET_USD > 0. Prices checked 2026-09-29:
  # kimi-k3 $3 / $15, kimi-k2.6 $0.95 / $4 per million tokens (in / out). New accounts allow only 3 requests/minute:
  # top up past tier 0 before using this for agent loops.
  kimi:
    lead:       [moonshot:kimi-k3]
    specialist: [moonshot:kimi-k2.6]
    dev:        [moonshot:kimi-k2.6]
    design:     [moonshot:kimi-k2.6]
    writer:     [moonshot:kimi-k2.6]
    sales:      [moonshot:kimi-k2.6]
    reports:    [moonshot:kimi-k2.6]
    qa:         [moonshot:kimi-k3]
    light:      [moonshot:kimi-k2.6]

# Free-tier guard rails (router): switch provider at 90% of these daily request caps.
# Speech-to-text for the CEO's voice input (dashboard mic, Telegram voice notes). First usable wins; only providers with
# an AI SDK transcription model (groq, openai). Checked 2026-09-29: HQ's Groq key has both Whisper models.
transcription: [groq:whisper-large-v3-turbo, groq:whisper-large-v3]

# Embeddings for the HQ Brain index (apps/brain, docs/16-BRAIN.md): provider:model, first entry wins. The index column is
# vector(1536), so the model must return 1536 dimensions. Needs BRAIN_OPENAI_API_KEY (brain container only). Changing the
# model re-embeds everything on the next sync (a few cents for the whole vault). env BRAIN_EMBED_MODEL overrides.
embeddings: [openai:text-embedding-3-small]

daily_request_caps:
  google: 40       # 20 per model per day on the free tier (2 models); a daily 429 also skips just that model
  groq: 1000
  openrouter: 50   # free account; ~1000/day after a one-time $10 credit purchase (OpenRouter policy)
