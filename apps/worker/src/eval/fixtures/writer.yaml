  - id: writer-seo-article-roofing
    title: "Article: How to choose a storm-damage roofer in Columbus"
    work_type: seo-article
    client: { name: Northfield Roofing Co., slug: northfield-roofing, platforms: [webflow], website: "https://northfieldroofing.example" }
    instructions: |
      Write a helpful blog article for Northfield Roofing Co. targeting "storm damage roofer Columbus". Audience: homeowners
      after a hailstorm. Include an H1 with the keyword, 4-6 H2 sections, a checklist, and a soft CTA to the free inspection
      page (/free-inspection). No invented statistics or claims about the client. Deliver as markdown; do not publish.
    acceptance_criteria:
      - "H1 contains \"storm damage roofer\" and Columbus"
      - "Between 4 and 6 H2 sections"
      - "Includes a homeowner checklist"
      - "No invented statistics or client claims"
      - "Ends with a CTA linking to /free-inspection"
    scripted:
      attempts:
        - output:
            summary: 5-section article with checklist and CTA to /free-inspection; no statistics used.
            content: |
              # How to Choose a Storm Damage Roofer in Columbus
              A hailstorm can leave damage you can't see from the ground. Here's how to pick a roofer you can trust.
              ## 1. Check the licence and insurance first
              Ask for proof of liability insurance and workers' compensation before anyone climbs your roof.
              ## 2. Be wary of door-to-door "storm chasers"
              Out-of-town crews often arrive after big storms. Choose a local company with a Columbus address.
              ## 3. Ask how they document damage
              A good roofer gives you dated photos and a written report you can share with your insurer.
              ## 4. Understand the insurance process
              Your roofer should explain what your adjuster will look for, not promise a claim outcome.
              ## 5. Get the warranty in writing
              Ask about both the manufacturer's and the workmanship warranty.
              **Homeowner checklist**
              - [ ] Proof of insurance
              - [ ] Local address and references
              - [ ] Photo report of the damage
              - [ ] Written estimate and warranty
              Not sure what the storm did to your roof? [Book a free inspection](/free-inspection).
          qa: { score: 90 }

