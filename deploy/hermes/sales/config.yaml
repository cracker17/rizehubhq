# RizeHub HQ · Hermes config for the Sales Agent (sales). Source of truth: deploy/hermes/sales/config.yaml in the repo.
# Mounted read-only into the hermes-sales container and copied to $HERMES_HOME/config.yaml on every start
# (changes made with `hermes config set` inside the container are overwritten: edit this file instead).
# ${VAR} placeholders are resolved by Hermes from the container env (.env.hermes-sales, made by scripts/split-env.mjs).
# Secrets are NOT in this file: API_SERVER_KEY and the provider key go to $HERMES_HOME/.env (entrypoint.sh).

# Model: provider from HERMES_PROVIDER (openrouter by default; anthropic / openai also work), model id from
# HERMES_MODEL_<AGENT> or HERMES_MODEL (OpenRouter ids are vendor/model, e.g. moonshotai/kimi-k2.6).
model:
  provider: ${HERMES_PROVIDER}
  default: ${HERMES_MODEL}

# OpenRouter only (ignored by other providers): cheapest healthy backend, never one that trains on our prompts.
provider_routing:
  sort: "price"
  data_collection: "deny"

# Side tasks Hermes runs on its own (titles, summaries, compression, memory upkeep, curator, vision, web extracts) use
# HERMES_AUX_MODEL, a cheap model (empty = the main model). They are outside HQ's per-task cost records; the hard stop is
# the credit limit on the OpenRouter key Hermes uses (HERMES_OPENROUTER_API_KEY, else OPENROUTER_API_KEY).
auxiliary:
  vision:
    provider: ${HERMES_PROVIDER}
    model: "${HERMES_AUX_MODEL}"
  compression:
    provider: ${HERMES_PROVIDER}
    model: "${HERMES_AUX_MODEL}"
  summarization:
    provider: ${HERMES_PROVIDER}
    model: "${HERMES_AUX_MODEL}"
  title:
    provider: ${HERMES_PROVIDER}
    model: "${HERMES_AUX_MODEL}"
  memory:
    provider: ${HERMES_PROVIDER}
    model: "${HERMES_AUX_MODEL}"
  curator:
    provider: ${HERMES_PROVIDER}
    model: "${HERMES_AUX_MODEL}"
  web_extract:
    provider: ${HERMES_PROVIDER}
    model: "${HERMES_AUX_MODEL}"

# Commands run inside this container only (local backend). No Docker backend: the container has no Docker socket.
terminal:
  backend: local
  cwd: /workspace
  timeout: 300

# HQ tools (report_progress, brain_*, ask_ceo, request_external_action, submit_output, vault/rizehub tools of this
# role, …) come from the worker's MCP endpoint. The token identifies this agent: the worker only exposes the
# sales role's tools, runs them against its current HQ task, and turns anything that publishes, sends, merges,
# deploys or spends into a CEO approval.
mcp_servers:
  hq:
    url: ${HQ_MCP_URL}
    headers:
      Authorization: "Bearer ${HQ_MCP_TOKEN}"

# API server: enabled through $HERMES_HOME/.env (API_SERVER_ENABLED/KEY/PORT/HOST, written by entrypoint.sh).
# Messaging platforms (Telegram, Discord, Slack, …) stay OFF: no platform tokens exist in this container.
