# /etc/nginx/sites-available/ws.rizehub.ph  (Operator workspace viewer → the lvlup browser on 127.0.0.1:3101)
# docs/17-OPERATOR.md "Workspace" and "Viewer login". Same box as HQ now; on the separate workspace VPS later.
#
#   sudo cp deploy/workspace/nginx-ws.rizehub.ph.conf /etc/nginx/sites-available/ws.rizehub.ph
#   sudo ln -sf /etc/nginx/sites-available/ws.rizehub.ph /etc/nginx/sites-enabled/ws.rizehub.ph
#   # the browser container's basic auth, injected by nginx so you never type it (file is root-only, not in git):
#   set -a; . deploy/workspace/.env; set +a
#   printf 'proxy_set_header Authorization "Basic %s";\n' "$(printf '%s:%s' "$WS_VIEWER_USER" "$WS_VIEWER_PASSWORD" | base64 -w0)" \
#     | sudo tee /etc/nginx/snippets/ws-lvlup-auth.conf >/dev/null && sudo chmod 600 /etc/nginx/snippets/ws-lvlup-auth.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ws.rizehub.ph --redirect -m <you@email> --agree-tos -n
#
# Login = the HQ login (phase 3): every request is checked with auth_request against the dashboard
# (/api/operator/viewer-check, HMAC token signed with OPERATOR_VIEWER_SECRET for a signed-in CEO with 2FA). No valid
# cookie → back to https://hq.rizehub.ph/api/operator/viewer?host=… → HQ login if needed → a fresh 12 h token → here.
# The container's own basic auth stays on as a second lock; nginx adds its header (snippet above).
# Separate workspace VPS: point $hq_check at https://hq.rizehub.ph/api/operator/viewer-check (and keep TLS verify on).
# Optional extra lock: uncomment the allow/deny lines to accept only your own IPs.
# Framing: only https://hq.rizehub.ph may embed it (the /operator page); every other site is refused.
# One hostname per client (the web desktop expects to live at the site root): ws.rizehub.ph → lvlup. A second client
# gets its own server block (and its own auth snippet), e.g. ws-traction.rizehub.ph → 127.0.0.1:3102.

map $http_upgrade $ws_connection_upgrade {
  default upgrade;
  ''      close;
}

# Only a token-shaped value is ever written into the cookie.
map $arg_t $hq_login_token {
  "~^[A-Za-z0-9_-]{20,900}\.[A-Za-z0-9_-]{20,100}$" $arg_t;
  default "";
}

server {
  listen 80;
  listen [::]:80;
  server_name ws.rizehub.ph;

  # allow 203.0.113.10;   # your home / office IP
  # deny all;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "frame-ancestors https://hq.rizehub.ph" always;
  proxy_hide_header X-Frame-Options;

  # HQ hands the CEO over here with a signed token: store it (HttpOnly, this host only) and open the desktop. It is
  # checked on the very next request like every other one, so a forged value only ends in a redirect to the HQ login.
  location = /__hq/login {
    if ($hq_login_token = "") { return 302 https://hq.rizehub.ph/api/operator/viewer?host=$host; }
    add_header Set-Cookie "hq_ws=$hq_login_token; Path=/; Max-Age=43200; Secure; HttpOnly; SameSite=Lax" always;
    add_header Cache-Control no-store always;
    return 302 /;
  }

  location = /__hq/check {
    internal;
    proxy_pass http://127.0.0.1:3100/api/operator/viewer-check;   # the dashboard on this box (docker-compose.yml)
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host hq.rizehub.ph;
    proxy_set_header X-HQ-Viewer-Token $cookie_hq_ws;
    proxy_set_header X-HQ-Viewer-Host $host;
  }

  location @hq_login {
    add_header Cache-Control no-store always;
    return 302 https://hq.rizehub.ph/api/operator/viewer?host=$host;
  }

  location / {
    auth_request /__hq/check;
    error_page 401 = @hq_login;
    include /etc/nginx/snippets/ws-lvlup-auth.conf;   # Authorization: Basic … for the container (see the header)
    proxy_pass https://127.0.0.1:3101;      # the container serves HTTPS with a self-signed certificate
    proxy_ssl_verify off;                    # loopback only; the public side is certbot's certificate
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;  # the web desktop streams over WebSockets
    proxy_set_header Connection $ws_connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;                # keep the live stream open
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
