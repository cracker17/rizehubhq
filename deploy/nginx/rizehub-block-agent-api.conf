# Snippet for RizeHub's PUBLIC server block (the existing rizehub.ph vhost), NOT for hq.rizehub.ph.
# The Agent API must only be reachable on the private Docker network (http://rizehub-app:8080/agent-api/v1),
# never from the internet (docs/12-RIZEHUB-INTEGRATION.md).
#
#   sudo cp deploy/nginx/rizehub-block-agent-api.conf /etc/nginx/snippets/rizehub-block-agent-api.conf
#   # inside EVERY `server { … }` of RizeHub's public site (80 and 443), above the other locations:
#   #     include /etc/nginx/snippets/rizehub-block-agent-api.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -s -o /dev/null -w '%{http_code}\n' https://<rizehub domain>/agent-api/v1/health   # → 404
#
# `^~` makes this win over regex locations (e.g. a PHP/Laravel `location ~ \.php$` catch-all).
location ^~ /agent-api/ {
  return 404;
}
location = /agent-api {
  return 404;
}
