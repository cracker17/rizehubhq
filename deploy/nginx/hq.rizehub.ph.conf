# /etc/nginx/sites-available/hq.rizehub.ph  (RizeHub HQ dashboard → 127.0.0.1:3100)
#
# Install (deploy/setup-vps.sh --with-nginx does exactly this):
#   sudo cp deploy/nginx/hq.rizehub.ph.conf /etc/nginx/sites-available/hq.rizehub.ph
#   sudo ln -sf /etc/nginx/sites-available/hq.rizehub.ph /etc/nginx/sites-enabled/hq.rizehub.ph
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d hq.rizehub.ph --redirect -m <you@email> --agree-tos -n
# certbot then adds the `listen 443 ssl` + certificate lines and the http→https redirect to THIS file,
# and renews automatically (systemd timer `certbot.timer`). Check: sudo certbot renew --dry-run
#
# WebSockets: not needed. The browser talks to Supabase Realtime directly (wss://<ref>.supabase.co),
# never through this proxy, and the Next.js production server serves no websockets. The Upgrade
# headers below are harmless and only there in case a future page streams through Next.

map $http_upgrade $hq_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name hq.rizehub.ph;

  # Uploads through the dashboard (vault files, evidence) stay small; raise if needed.
  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Enable after HTTPS works (certbot done), then never go back to plain http:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Immutable build assets: let the browser cache them hard.
  location /_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $hq_connection_upgrade;
    # Agent chat and server actions can take a while on free models.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
