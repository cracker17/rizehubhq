# RizeHub HQ production stack on the Hostinger VPS (docs/10-DEPLOY-VPS.md).
#   dashboard → 127.0.0.1:3100, published at https://hq.rizehub.ph by the host reverse proxy (deploy/nginx or deploy/Caddyfile)
#   worker    → no public port; reachable as http://hq-worker:4000 from the dashboard (default network)
#               and from RizeHub (shared external network `rizehub-internal`, webhooks → /hooks/rizehub)
#   bot       → Telegram long polling, no inbound port
#   brain     → no public port; http://hq-brain:4100 for the dashboard only (default network). Mirrors the memory vault
#               repo (deploy key in ./secrets/brain) and indexes it into Supabase (docs/16-BRAIN.md)
# Before the first `up`: `docker network create rizehub-internal` (deploy/setup-vps.sh does it), a filled master .env,
# then `node scripts/split-env.mjs` → .env.dashboard / .env.bot / .env.worker (each container gets ONLY its own
# variables: the dashboard never sees the service-role or vault key) and `pnpm check:env -- --split --production`.
# Images are tagged :latest; deploy/update.sh keeps :previous for rollback.
name: rizehubhq

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

# Shared settings of the four opt-in Hermes containers (services hermes-*; deploy/hermes/README.md).
x-hermes: &hermes
  image: rizehubhq-hermes:latest
  build: { context: deploy/hermes }
  profiles: [hermes]
  environment:
    HERMES_HOME: /data/hermes
    HQ_MCP_URL: http://hq-worker:4000/mcp       # the worker's HQ MCP tool server
    API_SERVER_HOST: 0.0.0.0
    API_SERVER_PORT: "8642"
  expose: ["8642"]                             # reached as http://hermes-<agent>:8642 by the worker; never `ports:`
  networks: [hermes]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$API_SERVER_KEY\" http://127.0.0.1:8642/health >/dev/null || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s
  init: true
  restart: unless-stopped
  mem_limit: 1g
  logging: *logging

services:
  dashboard:
    image: rizehubhq-dashboard:latest
    build: { context: ., dockerfile: apps/dashboard/Dockerfile }
    env_file: .env.dashboard                   # NEXT_PUBLIC_SUPABASE_*, HQ_WORKER_URL, HQ_INTERNAL_SECRET, DASHBOARD_URL only
    environment:
      HQ_WORKER_URL: http://hq-worker:4000     # overrides the localhost value used in dev
      BRAIN_URL: http://hq-brain:4100          # brain API (and the GitHub webhook passthrough /api/brain/github)
      AGENTS_DIR: /app/agents
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports: ["127.0.0.1:3100:3000"]             # loopback only: the reverse proxy is the only way in
    volumes:
      - ./agents:/app/agents:ro                # Agents page reads agents/<id>.md
    init: true
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  worker:
    image: rizehubhq-worker:latest
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    container_name: hq-worker                  # stable DNS name for the dashboard and RizeHub webhooks
    env_file: .env.worker                      # AI/vault/RizeHub/platform keys; no Telegram token, no DB password
    environment:
      AGENTS_DIR: /app/agents
      BRAIN_DIR: /app/brain
      WORKSPACES_DIR: /app/workspaces
      MODELS_FILE: /app/config/models.yaml
      WORKER_HTTP_PORT: "4000"
    expose: ["4000"]                           # internal networks only, never `ports:`
    volumes:
      - ./agents:/app/agents:ro
      - ./brain:/app/brain                     # written by the worker (root in the container); new files take brain/'s owner
      - ./config:/app/config:ro
      - workspaces:/app/workspaces             # jails owned by AGENT_UID (deploy/fix-perms.sh)
    # The worker runs as root INSIDE the container only to start agent commands as AGENT_UID (1001): agent code
    # can then not read the worker's secrets (/proc/<pid>/environ needs the same uid or CAP_SYS_PTRACE; docs/09).
    # Everything else root could do is dropped: only the capabilities that job needs are kept.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    networks: [default, rizehub-internal, hermes] # hermes: private network to the opt-in Hermes containers
    shm_size: 1gb                              # headless Chromium (QA screenshots, vault_login)
    init: true
    stop_grace_period: 60s                     # running tasks are re-queued on SIGTERM
    restart: unless-stopped
    mem_limit: 2g
    logging: *logging

  bot:
    image: rizehubhq-bot:latest
    build: { context: ., dockerfile: apps/bot/Dockerfile }
    env_file: .env.bot                         # Supabase service key + Telegram only
    init: true
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  # ---------- Hermes Agent runtime (opt-in: docker compose --profile hermes up -d; deploy/hermes/README.md) ----------
  # One container per agent, own HERMES_HOME volume, API server only (no messaging platforms), no published ports,
  # no Docker socket (local terminal backend), read-only root. Only the worker reaches them (network `hermes`).
  brain:
    image: rizehubhq-brain:latest
    build: { context: ., dockerfile: apps/brain/Dockerfile }
    container_name: hq-brain                   # stable DNS name for the dashboard (BRAIN_URL)
    env_file: .env.brain                       # Supabase service key + BRAIN_* only: never the worker's keys, never agents'
    environment:
      MODELS_FILE: /app/config/models.yaml
      BRAIN_VAULT_DIR: /data/vault
      BRAIN_HTTP_PORT: "4100"
      BRAIN_DEPLOY_KEY_PATH: /run/secrets/brain/brain_deploy_key
      BRAIN_KNOWN_HOSTS_PATH: /run/secrets/brain/known_hosts
    expose: ["4100"]                           # default network only (not rizehub-internal, not hermes): agents can't reach it
    volumes:
      - brain-vault:/data                      # the vault clone (rebuildable from GitHub at any time)
      - ./config:/app/config:ro
      - ./secrets/brain:/run/secrets/brain:ro  # deploy key + pinned GitHub host keys (deploy/brain-setup.sh); gitignored
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  hermes-web-dev:
    <<: *hermes
    container_name: hermes-web-dev
    env_file: [{ path: .env.hermes-web-dev, required: false }]
    volumes:
      - hermes-web-dev-home:/data/hermes
      - hermes-web-dev-work:/workspace
      - ./deploy/hermes/web-dev/config.yaml:/etc/hermes-hq/config.yaml:ro

  hermes-designer:
    <<: *hermes
    container_name: hermes-designer
    env_file: [{ path: .env.hermes-designer, required: false }]
    volumes:
      - hermes-designer-home:/data/hermes
      - hermes-designer-work:/workspace
      - ./deploy/hermes/designer/config.yaml:/etc/hermes-hq/config.yaml:ro

  hermes-writer:
    <<: *hermes
    container_name: hermes-writer
    env_file: [{ path: .env.hermes-writer, required: false }]
    volumes:
      - hermes-writer-home:/data/hermes
      - hermes-writer-work:/workspace
      - ./deploy/hermes/writer/config.yaml:/etc/hermes-hq/config.yaml:ro

  hermes-sales:
    <<: *hermes
    container_name: hermes-sales
    env_file: [{ path: .env.hermes-sales, required: false }]
    volumes:
      - hermes-sales-home:/data/hermes
      - hermes-sales-work:/workspace
      - ./deploy/hermes/sales/config.yaml:/etc/hermes-hq/config.yaml:ro

volumes:
  workspaces:
  brain-vault:
  hermes-web-dev-home:
  hermes-web-dev-work:
  hermes-designer-home:
  hermes-designer-work:
  hermes-writer-home:
  hermes-writer-work:
  hermes-sales-home:
  hermes-sales-work:

networks:
  default: {}
  rizehub-internal:
    external: true   # create once: docker network create rizehub-internal
  hermes: {}         # worker ↔ hermes-* only. Not `internal: true`: Hermes needs HTTPS egress to the model provider API
