# RizeHub HQ roster: what the COO routes on (docs/04-AGENTS.md)
# Six agents: coo, web-dev, designer, writer, sales, qa-lead. work_type → owning agent.
# Every work_type has an SOP at brain/sops/<work_type>.md and a QA checklist at brain/qa-checklists/<work_type>.md
# runtime: worker = Vercel AI SDK runner in apps/worker; hermes = Hermes Agent instance (until that runtime lands,
# hermes agents run on the worker runner too). Set per agent in the role file front-matter.

agents:
  coo:      { name: COO,              department: leadership, runtime: worker, model_role: lead }
  web-dev:  { name: Web Developer,    department: dev,        runtime: hermes, model_role: dev }
  designer: { name: Graphic Designer, department: design,     runtime: hermes, model_role: design }
  writer:   { name: Content Writer,   department: content,    runtime: hermes, model_role: writer }
  sales:    { name: Sales Agent,      department: growth,     runtime: hermes, model_role: sales }
  qa-lead:  { name: QA,               department: qa,         runtime: worker, model_role: qa }

routing:
  # Leadership & ops (COO plans and runs onboarding, client reports and the CEO's inbox/briefs itself)
  planning:             coo
  weekly-summary:       coo
  inbox-triage:         coo
  daily-report:         coo
  client-report:        coo
  meeting-prep:         coo
  client-onboarding:    coo
  workspace-setup:      coo
  access-checklist:     coo

  # Growth (Sales Agent: lead finding → research → outreach → replies → proposals → follow-ups;
  # also screens contract/job opportunities for the CEO and drafts his applications)
  lead-finder-search:   sales
  lead-report:          sales
  outreach-draft:       sales
  dm-reply-draft:       sales
  lead-qualification:   sales
  proposal:             sales
  follow-up-email:      sales
  job-search:           sales
  job-application:      sales

  # Dev (Web Developer: Shopify, Webflow, WordPress, full-stack)
  shopify-section:      web-dev
  shopify-page:         web-dev
  shopify-theme-fix:    web-dev
  shopify-speed:        web-dev
  webflow-page:         web-dev
  webflow-cms:          web-dev
  webflow-interaction:  web-dev
  wordpress-page:       web-dev
  wordpress-plugin:     web-dev
  wordpress-fix:        web-dev
  web-app:              web-dev
  api-integration:      web-dev
  automation:           web-dev

  # Design (Graphic Designer: UI/UX + graphics; always delivers a design spec + assets)
  wireframe:            designer
  ui-mockup:            designer
  ux-audit:             designer
  ad-creative:          designer
  social-graphic:       designer
  brand-asset:          designer

  # Content (Content Writer: SEO + social + short-video scripts)
  seo-article:          writer
  landing-copy:         writer
  meta-tags:            writer
  keyword-research:     writer
  content-calendar:     writer
  social-captions:      writer
  short-video-script:   writer

qa:
  default: qa-lead          # every deliverable is reviewed before it reaches the CEO

# Lets "fix the Madam Muse store" route to the developer without naming the platform
platform_to_dev:
  shopify: web-dev
  webflow: web-dev
  wordpress: web-dev
  custom: web-dev
